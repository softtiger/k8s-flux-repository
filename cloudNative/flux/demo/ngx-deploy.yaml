apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ngx-dep
  name: ngx-dep
  namespace: default
  annotations:
    kubernetes.io/change-cause: v2, ngx=1.23
spec:
  minReadySeconds: 15
  replicas: 2
  selector:
    matchLabels:
      app: ngx-dep
  strategy: {}
  template:
    metadata:
      labels:
        app: ngx-dep
    spec:
      volumes:
        - name: ngx-conf-vol
          configMap:
            name: ngx-conf
      containers:
        - image: nginx:1.23-alpine
          name: nginx
          ports:
            - containerPort: 80
          resources: {}
          volumeMounts:
            - mountPath:  /etc/nginx/conf.d
              name: ngx-conf-vol
          startupProbe:
            periodSeconds: 1
            exec:
              command: [ "cat","/var/run/nginx.pid" ]
          livenessProbe:
            periodSeconds: 10
            tcpSocket:
              port: 80
          readinessProbe:
              periodSeconds: 5
              httpGet:
                path: /ready
                port: 80
status: {}