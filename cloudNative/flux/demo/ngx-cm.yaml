apiVersion: v1
kind: ConfigMap
metadata:
  name: ngx-conf
  namespace: default
data:
  default.conf: |
    server {
      listen 80;

      location / {
        default_type text/plain;
        return 200 '
          srv : $server_addr:$server_port
          host: $hostname
          ver:  $nginx_version
          uri : $request_method';
      }
    
      location = /ready {
          return 200 'I am ready';  
      }
    }
